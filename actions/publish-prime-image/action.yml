name: 'Publish Prime Image'
description: 'Build, publish, and sign one prime or staging image with provenance and SBOM attestations; signing and SLSA attestation can be disabled for test builds'

inputs:
  context:
    description: 'Docker build context'
    required: false
    default: '.'
  dockerfile:
    description: 'Path to the Dockerfile'
    required: true
  image:
    description: 'Image name without registry, repository, or tag'
    required: true
  tag:
    description: 'Image tag'
    required: true
  platforms:
    description: 'Comma-separated target platforms'
    required: false
    default: 'linux/amd64,linux/arm64'
  build-args:
    description: 'Newline-delimited Docker build arguments'
    required: false
    default: ''
  cache-scope:
    description: 'GitHub Actions cache scope; defaults to the image name'
    required: false
    default: ''
  registry:
    description: 'Prime or staging registry hostname'
    required: true
  repository:
    description: 'Prime or staging registry repository or organization'
    required: true
  identity-registry:
    description: 'Registry used in the signed image identity; defaults to the destination registry'
    required: false
    default: ''
  sbom:
    description: 'Generate an SBOM attestation; disable for images whose SBOM exceeds the BuildKit 40MiB attestation size limit'
    required: false
    default: 'true'
  sign:
    description: 'Sign the image digest with keyless Cosign; disable only for test builds outside the release pipeline'
    required: false
    default: 'true'
  attest:
    description: 'Publish a signed SLSA provenance attestation; disable only for test builds outside the release pipeline'
    required: false
    default: 'true'
  allow-docker-hub:
    description: 'Allow docker.io as the destination registry; enable only for test builds outside the release pipeline'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Validate registry and resolve cache scope
      id: config
      shell: bash
      env:
        ALLOW_DOCKER_HUB: ${{ inputs.allow-docker-hub }}
        ATTEST: ${{ inputs.attest }}
        CACHE_SCOPE: ${{ inputs.cache-scope }}
        IMAGE: ${{ inputs.image }}
        REGISTRY: ${{ inputs.registry }}
        SIGN: ${{ inputs.sign }}
      run: |
        for value in "$SIGN" "$ATTEST" "$ALLOW_DOCKER_HUB"; do
          if [[ "$value" != true && "$value" != false ]]; then
            echo "The sign, attest, and allow-docker-hub inputs must be 'true' or 'false'" >&2
            exit 1
          fi
        done

        if [[ "$REGISTRY" == docker.io ]]; then
          if [[ "$ALLOW_DOCKER_HUB" != true ]]; then
            echo "The prime or staging registry cannot be docker.io" >&2
            exit 1
          fi
          echo "::warning::Publishing ${IMAGE} to docker.io because allow-docker-hub is true"
        fi
        if [[ "$SIGN" != true || "$ATTEST" != true ]]; then
          echo "::warning::Publishing ${IMAGE} with sign=${SIGN} and attest=${ATTEST}"
        fi

        cache_scope="${CACHE_SCOPE:-$IMAGE}"
        cache_scope="${cache_scope//[^a-zA-Z0-9_.-]/-}"
        echo "cache-scope=$cache_scope" >> "$GITHUB_OUTPUT"

    # install-slsactl also installs Cosign, so install it separately only when
    # signing without attestation.
    - name: Install Cosign
      if: inputs.sign == 'true' && inputs.attest != 'true'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    # temporary workaround until we add harvester mappings in rancher/slsactl
    - name: Install slsactl
      if: inputs.attest == 'true'
      uses: rancherlabs/slsactl/actions/install-slsactl@22b4f4bf17657fc9275fb914c4179257f20c898a
      with:
        version: v0.1.43

    - name: Build and push prime image
      id: push
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        build-args: ${{ inputs.build-args }}
        push: true
        tags: ${{ inputs.registry }}/${{ inputs.repository }}/${{ inputs.image }}:${{ inputs.tag }}
        provenance: true
        sbom: ${{ inputs.sbom }}
        cache-from: type=gha,scope=${{ steps.config.outputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=${{ steps.config.outputs.cache-scope }}

    - name: Sign prime image
      if: inputs.sign == 'true'
      shell: bash
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
        IDENTITY_REGISTRY: ${{ inputs.identity-registry }}
        IMAGE: ${{ inputs.image }}
        REGISTRY: ${{ inputs.registry }}
        REPOSITORY: ${{ inputs.repository }}
      run: |
        if [[ -z "$DIGEST" ]]; then
          echo "The image digest is empty; refusing to sign" >&2
          exit 1
        fi

        identity_registry="${IDENTITY_REGISTRY:-$REGISTRY}"
        image_ref="${REGISTRY}/${REPOSITORY}/${IMAGE}@${DIGEST}"
        identity="${identity_registry}/${REPOSITORY}/${IMAGE}"

        cosign sign \
          --oidc-provider=github-actions \
          --yes \
          --sign-container-identity="$identity" \
          "$image_ref"

    - name: Attest provenance
      if: inputs.attest == 'true'
      shell: bash
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
        IMAGE: ${{ inputs.image }}
        LANDLOCK_MODE: DISABLED
        REGISTRY: ${{ inputs.registry }}
        REPOSITORY: ${{ inputs.repository }}
        TAG: ${{ inputs.tag }}
      run: |
        image_ref="${REGISTRY}/${REPOSITORY}/${IMAGE}:${TAG}@${DIGEST}"
        provenance_file="$(mktemp)"
        trap 'rm -f "$provenance_file"' EXIT

        for attempt in 1 2 3; do
          if slsactl download provenance --format=slsav1 "$image_ref" > "$provenance_file"; then
            break
          fi

          if [[ "$attempt" == 3 ]]; then
            echo "Failed to download SLSA provenance for $image_ref" >&2
            cat "$provenance_file"
            exit 1
          fi

          sleep 5
        done

        cat "$provenance_file"
        cosign attest \
          --yes \
          --predicate "$provenance_file" \
          --type slsaprovenance1 \
          "$image_ref"
